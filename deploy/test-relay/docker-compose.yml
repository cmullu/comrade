# Isolated Nostr relay for integration/device testing (AUDIT.md COMMS-03).
#
# NOT used by the hermetic Rust integration suite (crates/comrade_ui/tests/) —
# that suite embeds its own minimal in-process relay (tests/support) so it
# needs neither Docker nor a network. This compose file is for tests that
# genuinely need a relay reachable over a real socket:
#   - The Android two-peer instrumented test
#     (android/app/src/androidTest/.../TwoPeerJniIntegrationTest.kt), which
#     needs an address the device can reach. CI uses
#     `adb reverse tcp:8090 tcp:8090` and passes `ws://127.0.0.1:8090`, not the
#     `10.0.2.2` emulator-to-host loopback — see android-apk.yml for why (it
#     also works on a physical handset, which 10.0.2.2 cannot).
#   - Manual/local end-to-end testing against a real relay implementation
#     instead of the public relay pool.
#
# Usage:
#   docker compose -f deploy/test-relay/docker-compose.yml up -d
#   # relay is now at ws://localhost:8090 (host) / ws://10.0.2.2:8090 (emulator)
#
# Not independently verified in this change (built without a local Docker
# daemon available) — validate in CI/locally before relying on it.
services:
  test-relay:
    # Pinned, not `:latest`, since 2026-08-09 — this is a **required** CI gate
    # now (`android-apk.yml`'s device lanes), and `:latest` means an upstream
    # push can turn a branch red with no change of ours. The exit condition for
    # bumping it: the relay stops accepting `config.toml` as written, or a NIP
    # this app depends on is only in a newer release.
    image: scsibug/nostr-rs-relay:0.10.0
    environment:
      # The relay's own log is the only independent witness to whether the peers
      # ever reached it, and at the default level it is **not** a witness: the
      # 2026-08-09 device run produced a relay log of startup lines and six
      # one-a-minute sqlite checkpoints, identical to what an idle relay with no
      # client at all produces. "No connections logged" was therefore not
      # evidence of no connections, and the actual cause (two peers sharing one
      # runtime) had to be found by reading the FFI instead.
      #
      # `debug` on the relay's own crate logs client connect/disconnect and each
      # EVENT/REQ, which is what makes "the peers never arrived" and "they
      # arrived and the test is wrong" different-looking failures. Scoped to the
      # crate rather than global `debug`, which drowns it in tungstenite and
      # sqlx. Exit condition: none — this is a test relay, and its log being
      # readable is the point.
      RUST_LOG: "info,nostr_rs_relay=debug"
    ports:
      - "8090:8080"
    volumes:
      - ./config.toml:/usr/src/app/config.toml:ro
      - test-relay-data:/usr/src/app/db
    restart: unless-stopped

volumes:
  test-relay-data:

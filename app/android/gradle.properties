org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Hands ABI selection to app/build.gradle.kts's `defaultConfig.ndk.abiFilters`.
# The Flutter plugin otherwise *clears* that set and re-adds its own three ABIs
# (FlutterPlugin.kt, `configureAbiWithoutSplits`), which would put an
# armeabi-v7a slice with no libcomrade_jni.so back into the APK. Set here rather
# than passed as `-P` so `flutter build apk`, `flutter run` and CI all agree.
# If those abiFilters are ever removed, remove this too — on its own it means
# "no filtering at all", not "Flutter's default".
disable-abi-filtering=true
